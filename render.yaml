services:
  - type: web
    name: integrated-delivery-portal-api
    runtime: php
    plan: starter
    region: oregon

    rootDir: backend

    buildCommand: composer install --no-dev --optimize-autoloader

    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: APP_TIMEZONE
        value: Africa/Addis_Ababa

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: mysql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "3306"

      - key: DB_DATABASE
        value: bilconof_delivery_portal

      - key: DB_USERNAME
        value: bilconof_delivery_user

      - key: DB_PASSWORD
        sync: false

      - key: APP_URL
        sync: false

      - key: FRONTEND_URL
        value: https://integrated-delivery-portal.vercel.app

      - key: CORS_ALLOWED_ORIGINS
        value: https://integrated-delivery-portal.vercel.app

      - key: SANCTUM_STATEFUL_DOMAINS
        value: integrated-delivery-portal.vercel.app